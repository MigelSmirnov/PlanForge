<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>PlanForge example</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <strong>Размеры плана</strong>
    <span id="progress">0 / 0</span>
    <button id="fit">Вписать</button>
    <button id="saveProject">JSON</button>
    <label class="file">Открыть JSON<input id="openProject" type="file" accept="application/json"></label>
    <button id="exportSvg">SVG</button>
  </header>

  <main id="viewport">
    <div id="stage">
      <img id="plan" src="assets/plan.svg" alt="Синтетический план" draggable="false">
      <svg id="overlay" viewBox="0 0 1200 800" aria-label="Поля размеров"></svg>
    </div>
  </main>

  <dialog id="editor">
    <form method="dialog" id="editorForm">
      <h2 id="fieldTitle">Размер</h2>
      <label>Значение, мм<input id="value" inputmode="decimal" autocomplete="off"></label>
      <p id="error" role="status"></p>
      <div class="dialogActions">
        <button value="cancel">Закрыть</button>
        <button type="button" id="clear">Очистить</button>
        <button type="submit" class="primary">Сохранить</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
